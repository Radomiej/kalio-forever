map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map "$host:$http_x_forwarded_proto" $redirect_remote_https {
    default 0;
    "kalio-remote.nekko.software:http" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    if ($redirect_remote_https) {
        return 308 https://kalio-remote.nekko.software$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(healthz|v1/(pair|device|agent/[^/]+))$ {
        proxy_pass http://relay:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
