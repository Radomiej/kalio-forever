# Canonical Kalio-Forever dev MCP profile.
# Copy the relevant blocks into .kalio/config.toml or
# %USERPROFILE%\.kalio\config.toml.
# Use Settings import only as a legacy/manual fallback, not alongside this TOML
# profile as an active duplicate source of truth.

[features]
mcp = true

[mcp_servers.mcp-dev-servers]
command = "node"
args = ["C:\\Projekty\\mcp-dev-servers\\dist\\index.js", "stdio"]
enabled = true
required = true
startup_timeout_ms = 30000
tool_timeout_sec = 120
env = { DEV_SERVERS_BACKEND_URL = "http://127.0.0.1:3418", DEV_SERVERS_API_TOKEN = "change-me-local-token" }

[mcp_servers.mcp-playwright-orchestrator]
command = "node"
args = ["C:\\Projekty\\mcp-playwrigh-master\\dist\\index.js", "--mode", "stdio"]
enabled = true
required = true
startup_timeout_ms = 30000
tool_timeout_sec = 180
env = { MCP_PLAYWRIGHT_DATA_DIR = "C:\\Projekty\\mcp-playwrigh-master\\.local-data\\mcp-playwright-orchestrator", PLAYWRIGHT_BROWSERS_PATH = "C:\\Projekty\\mcp-playwrigh-master\\.ms-playwright", MCP_PLAYWRIGHT_IDLE_SWEEP_MS = "60000", MCP_PLAYWRIGHT_STDIO_SERVER_URL = "http://127.0.0.1:3333/mcp", MCP_PLAYWRIGHT_STDIO_RECONNECT_TIMEOUT_MS = "15000" }
