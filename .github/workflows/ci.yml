name: CI

on:
  push:
    branches:
      - mvp
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Runtime and installer contracts
        run: node --test scripts/runtime-scripts.test.mjs scripts/kalio-updater.test.mjs scripts/stack-state.test.mjs
      - name: macOS installer lifecycle regressions
        if: runner.os != 'Windows'
        run: node --test scripts/macos-installer.test.mjs

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @kalio/types --filter @kalio/sdk build

      - name: Run workspace tests
        run: pnpm turbo run test --filter=!@kalio/e2e

      - name: Run Playwright launcher tests
        run: pnpm --filter @kalio/e2e test

  backend:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      DATABASE_PATH: /tmp/kalio-backend-ci.db
      MEMORY_DB_PATH: /tmp/kalio-backend-ci-memory
      WORKSPACE_ROOT: /tmp/kalio-backend-workspace
      CREDENTIALS_MASTER_KEY: ci-test-master-key-32-chars-minimum
      LLM_PROVIDER: mock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @kalio/types --filter @kalio/sdk build

      - name: Backend typecheck
        run: pnpm --filter kalio-api typecheck

      - name: Backend coverage gate
        run: pnpm --filter kalio-api test:cov

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm --filter kalio-web typecheck

      - name: Frontend coverage gate
        run: pnpm --filter kalio-web test:cov

      - name: Frontend mutation gate
        run: pnpm --filter kalio-web test:mutation

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit gate
        run: pnpm audit:report

  e2e:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      LLM_PROVIDER: mock
      CREDENTIALS_MASTER_KEY: ci-test-master-key-32-chars-minimum
      KALIO_E2E_PROJECT_PATH: ${{ github.workspace }}
      KALIO_CONTROL_PLANE_AUTH: disabled
      KALIO_HOST: 127.0.0.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @kalio/types --filter @kalio/sdk build

      - name: Install Playwright browsers
        run: pnpm --filter @kalio/e2e exec playwright install --with-deps chromium

      - name: Smoke E2E gate
        run: pnpm --filter @kalio/e2e test:e2e -- --project=chromium

  quality-gate:
    runs-on: ubuntu-latest
    needs:
      - tests
      - backend
      - frontend
      - audit
      - e2e
    steps:
      - name: Quality gate passed
        run: echo 'All required quality gates passed.'
