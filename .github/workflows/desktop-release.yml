name: Desktop release

on:
  # Desktop/runtime release builds run only on main pushes, release tags and
  # manual dispatch — never on pull requests or feature branches.
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify synchronized release version
        run: node scripts/bump-version.mjs --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build Windows runtime archive
        shell: pwsh
        env:
          KALIO_RUNTIME_UPDATE_PUBLIC_KEY: ${{ vars.KALIO_RUNTIME_UPDATE_PUBLIC_KEY }}
        run: |
          node --test scripts/runtime-archive.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime archive regression tests failed' }
          $nodePath = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          $bunPath = (Get-Command bun -CommandType Application | Select-Object -First 1).Source
          $env:KALIO_NODE_BINARY = $nodePath
          $env:KALIO_BUN_BINARY = $bunPath
          New-Item -ItemType Directory -Path release -Force | Out-Null
          node scripts/build-runtime-package.mjs --platform windows --output release --runtime node
          if ($LASTEXITCODE -ne 0) { throw 'Node runtime archive creation failed' }
          node scripts/build-runtime-package.mjs --platform windows --output release --runtime bun
          if ($LASTEXITCODE -ne 0) { throw 'Bun runtime archive creation failed' }

      - name: Smoke test Windows runtime archives
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          pnpm runtime:smoke -- --archive "release\kalio-runtime-$version-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Node runtime archive smoke test failed' }
          pnpm runtime:smoke -- --archive "release\kalio-runtime-$version-bun-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Bun runtime archive smoke test failed' }

      - name: Configure optional updater signing
        id: updater
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $values = @(
            $env:TAURI_SIGNING_PRIVATE_KEY,
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
            $env:TAURI_UPDATER_PUBLIC_KEY
          )
          $present = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($present -gt 0 -and $present -lt 3) {
            throw 'Updater signing is partially configured; set all three Tauri updater secrets or none'
          }
          if ($present -eq 0) {
            Write-Warning 'Tauri updater signing is disabled; release will contain unsigned/manual-update artifacts'
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'kalio-tauri-updater.json'
          node scripts/tauri-updater-config.mjs $configPath
          if ($LASTEXITCODE -ne 0) { throw 'Tauri updater config generation failed' }
          "TAURI_UPDATER_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Report Windows Authenticode status
        shell: pwsh
        run: Write-Warning 'Windows Authenticode signing is intentionally disabled for this release lane'

      - name: Build unsigned Windows Tauri package
        if: steps.updater.outputs.enabled != 'true'
        run: pnpm tauri build --no-sign

      - name: Build Windows Tauri package with optional updater signature
        if: steps.updater.outputs.enabled == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config "$env:TAURI_UPDATER_CONFIG"

      - name: Smoke test installed Windows Tauri app
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'src-tauri\target\release\bundle\nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'The NSIS installer was not found' }
          & .\scripts\desktop-installer-smoke.ps1 -InstallerPath $installer.FullName

      - name: Smoke test packaged Windows backend
        run: pnpm desktop:smoke

      - name: Prepare Windows release metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath LICENSE -Destination release\LICENSE -Force
          Copy-Item -LiteralPath COMMERCIAL-LICENSE.md -Destination release\COMMERCIAL-LICENSE.md -Force
          Copy-Item -LiteralPath COMMERCIAL-LICENSE-AGREEMENT-TEMPLATE.md -Destination release\COMMERCIAL-LICENSE-AGREEMENT-TEMPLATE.md -Force
          node scripts/generate-third-party-notices.mjs --output release\THIRD_PARTY_NOTICES.md
          if ($LASTEXITCODE -ne 0) { throw 'Third-party notices generation failed' }
          $installer = Get-ChildItem -LiteralPath 'src-tauri\target\release\bundle\nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'The NSIS installer was not found' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -LiteralPath release\SHA256SUMS-windows.txt -Encoding utf8
          Get-ChildItem -LiteralPath release -Filter 'kalio-runtime-*-windows-x64.zip' -File | ForEach-Object {
            $runtimeHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            "$runtimeHash  $($_.Name)" | Add-Content -LiteralPath release\SHA256SUMS-windows.txt -Encoding utf8
          }

      - name: Upload independently reviewable Windows checksums
        uses: actions/upload-artifact@v4
        with:
          name: kalio-windows-metadata
          if-no-files-found: error
          path: release/SHA256SUMS-windows.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kalio-windows
          if-no-files-found: error
          path: |
            release/kalio-runtime-*-windows-x64.zip
            release/LICENSE
            release/COMMERCIAL-LICENSE.md
            release/COMMERCIAL-LICENSE-AGREEMENT-TEMPLATE.md
            release/THIRD_PARTY_NOTICES.md
            release/SHA256SUMS-windows.txt
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Upload optional Windows updater signatures
        uses: actions/upload-artifact@v4
        with:
          name: kalio-windows-updater
          if-no-files-found: ignore
          path: src-tauri/target/release/bundle/nsis/*.sig

  build-linux:
    runs-on: ubuntu-24.04
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify synchronized release version
        run: node scripts/bump-version.mjs --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install baseline Bun runtime for Linux archive
        shell: bash
        run: |
          baseline_root="$RUNNER_TEMP/kalio-bun-baseline"
          npm install --prefix "$baseline_root" --no-save --no-audit --no-fund "@oven/bun-linux-x64-baseline@1.2.18"
          baseline_binary="$baseline_root/node_modules/@oven/bun-linux-x64-baseline/bin/bun"
          test -x "$baseline_binary"
          "$baseline_binary" --version
          echo "KALIO_BUN_BINARY=$baseline_binary" >> "$GITHUB_ENV"

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libc6-dev libfuse2t64 patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build Linux runtime archive
        shell: bash
        env:
          KALIO_RUNTIME_UPDATE_PUBLIC_KEY: ${{ vars.KALIO_RUNTIME_UPDATE_PUBLIC_KEY }}
        run: |
          export KALIO_NODE_BINARY="$(command -v node)"
          export KALIO_BUN_BINARY="${KALIO_BUN_BINARY:-$(command -v bun)}"
          mkdir -p release
          node scripts/build-runtime-package.mjs --platform linux --output release --runtime node
          node scripts/build-runtime-package.mjs --platform linux --output release --runtime bun

      - name: Smoke test the packaged Linux Node runtime
        shell: bash
        run: |
          archive=$(find release -maxdepth 1 -name 'kalio-runtime-*-linux-x64.tar.gz' ! -name '*-bun-linux-x64.tar.gz' -print -quit)
          test -n "$archive"
          node scripts/smoke-linux-runtime.mjs --archive "$archive" --output release/linux-node-smoke.json

      - name: Upload Linux runtime archives
        uses: actions/upload-artifact@v4
        with:
          name: kalio-linux-runtime
          if-no-files-found: error
          path: |
            release/kalio-runtime-*-linux-x64.tar.gz
            release/linux-node-smoke.json

      - name: Split Linux Bun runtime archive for manual verification
        shell: bash
        run: |
          mkdir -p release-bun-parts
          bun_archive="$(find release -maxdepth 1 -type f -name '*-bun-linux-x64.tar.gz' -print -quit)"
          test -n "$bun_archive"
          split -b 300m -d -a 2 "$bun_archive" release-bun-parts/kalio-bun-runtime.part.
          ls -lh release-bun-parts

      - name: Upload Linux Bun runtime part 00
        uses: actions/upload-artifact@v4
        with:
          name: kalio-linux-bun-part-00
          if-no-files-found: ignore
          path: release-bun-parts/kalio-bun-runtime.part.00

      - name: Upload Linux Bun runtime part 01
        uses: actions/upload-artifact@v4
        with:
          name: kalio-linux-bun-part-01
          if-no-files-found: ignore
          path: release-bun-parts/kalio-bun-runtime.part.01

      - name: Upload Linux Bun runtime part 02
        uses: actions/upload-artifact@v4
        with:
          name: kalio-linux-bun-part-02
          if-no-files-found: ignore
          path: release-bun-parts/kalio-bun-runtime.part.02

      - name: Upload Linux Bun runtime part 03
        uses: actions/upload-artifact@v4
        with:
          name: kalio-linux-bun-part-03
          if-no-files-found: ignore
          path: release-bun-parts/kalio-bun-runtime.part.03
      - name: Smoke test Linux runtime archives
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          pnpm runtime:smoke -- --archive "release/kalio-runtime-${version}-linux-x64.tar.gz"
          pnpm runtime:smoke -- --archive "release/kalio-runtime-${version}-bun-linux-x64.tar.gz"

      - name: Configure optional updater signing
        id: updater
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          present=0
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && present=$((present + 1))
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && present=$((present + 1))
          [ -n "$TAURI_UPDATER_PUBLIC_KEY" ] && present=$((present + 1))
          if [ "$present" -gt 0 ] && [ "$present" -lt 3 ]; then
            echo 'Updater signing is partially configured; set all three Tauri updater secrets or none' >&2
            exit 1
          fi
          if [ "$present" -eq 0 ]; then
            echo 'Tauri updater signing is disabled; release will contain unsigned/manual-update artifacts' >&2
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          config_path="$RUNNER_TEMP/kalio-tauri-updater.json"
          node scripts/tauri-updater-config.mjs "$config_path"
          echo "TAURI_UPDATER_CONFIG=$config_path" >> "$GITHUB_ENV"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Build unsigned Linux Tauri package
        if: steps.updater.outputs.enabled != 'true'
        run: pnpm tauri build --config src-tauri/tauri.linux.conf.json --no-sign --verbose

      - name: Build Linux Tauri package with optional updater signature
        if: steps.updater.outputs.enabled == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.linux.conf.json --config "$TAURI_UPDATER_CONFIG" --verbose

      - name: Smoke test packaged Linux backend
        run: pnpm desktop:smoke

      - name: Prepare Linux release metadata
        shell: bash
        run: |
          mkdir -p release
          cp LICENSE release/LICENSE
          cp COMMERCIAL-LICENSE.md release/COMMERCIAL-LICENSE.md
          cp COMMERCIAL-LICENSE-AGREEMENT-TEMPLATE.md release/COMMERCIAL-LICENSE-AGREEMENT-TEMPLATE.md
          node scripts/generate-third-party-notices.mjs --output release/THIRD_PARTY_NOTICES.md
          find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) -print0 | sort -z | xargs -0 sha256sum | sed 's@  .*/@  @' > release/SHA256SUMS-linux.txt
          (cd release && sha256sum kalio-runtime-*-linux-x64.tar.gz) >> release/SHA256SUMS-linux.txt
          test -s release/SHA256SUMS-linux.txt

      - name: Upload independently reviewable Linux checksums
        uses: actions/upload-artifact@v4
        with:
          name: kalio-linux-metadata
          if-no-files-found: error
          path: release/SHA256SUMS-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kalio-linux
          if-no-files-found: error
          path: |
            release/kalio-runtime-*-linux-x64.tar.gz
            release/LICENSE
            release/COMMERCIAL-LICENSE.md
            release/COMMERCIAL-LICENSE-AGREEMENT-TEMPLATE.md
            release/THIRD_PARTY_NOTICES.md
            release/SHA256SUMS-linux.txt
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload optional Linux updater signatures
        uses: actions/upload-artifact@v4
        with:
          name: kalio-linux-updater
          if-no-files-found: ignore
          path: src-tauri/target/release/bundle/appimage/*.sig

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify synchronized release version
        run: node scripts/bump-version.mjs --check

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kalio-*
          path: release-assets
          merge-multiple: true

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -LiteralPath 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($packageVersion -ne $tauriVersion -or $tagVersion -ne $tauriVersion) {
            throw "Release version mismatch: tag=$tagVersion package=$packageVersion tauri=$tauriVersion"
          }

      - name: Generate updater manifest when signatures exist
        shell: pwsh
        run: |
          $signatures = @(Get-ChildItem -LiteralPath release-assets -Filter '*.sig' -File -Recurse)
          if ($signatures.Count -eq 0) {
            Write-Warning 'No updater signatures found; latest.json will not be generated'
            exit 0
          }
          $env:KALIO_RELEASE_VERSION = (Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          node scripts/generate-tauri-latest-json.mjs release-assets release-assets/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'Tauri updater manifest generation failed' }

      - name: Generate standalone runtime update manifest
        shell: pwsh
        env:
          KALIO_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.KALIO_RUNTIME_SIGNING_PRIVATE_KEY }}
        run: |
          node scripts/generate-runtime-release-manifest.mjs release-assets release-assets/kalio-runtime-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Standalone runtime manifest generation failed' }

      - name: Create or update draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem -LiteralPath release-assets -File -Recurse | Where-Object {
            $_.Name -match '\.(exe|zip|tar\.gz|AppImage|deb|md|txt|json|sig)$'
          } | Select-Object -ExpandProperty FullName)
          if ($assets.Count -eq 0) { throw 'No release assets were downloaded' }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --generate-notes --title "Kalio $tag"
            if ($LASTEXITCODE -ne 0) { throw 'Draft GitHub release creation failed' }
          }

          foreach ($asset in $assets) {
            gh release upload $tag $asset --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed: $asset" }
          }
          gh release edit $tag --draft=true --title "Kalio $tag"
          if ($LASTEXITCODE -ne 0) { throw 'Draft GitHub release update failed' }
